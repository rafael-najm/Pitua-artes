# Publica o site no GitHub Pages a cada push na branch main.
# Antes do primeiro deploy: Settings → Pages → Source: "GitHub Actions".
# Só publica a partir da branch padrão do repositório (Settings → Default branch),
# que é a única que o GitHub Pages aceita.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          # Endereço padrão do GitHub Pages: https://<usuario>.github.io/<repositorio>/
          # Com domínio próprio, troque por SITE_URL: https://seudominio.com.br e BASE_PATH: /
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Publicações seguidas entram na fila em vez de cancelar a que está em andamento.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
